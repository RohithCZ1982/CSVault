databases:
  - name: csvault-db
    plan: free
    databaseName: csvault
    user: csvault

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: csvault-api
    runtime: node
    rootDir: server
    plan: free
    # --include=dev: NODE_ENV=production makes npm skip devDependencies (typescript, @types/*) otherwise
    # sed: repo schema uses sqlite for local dev; production runs on PostgreSQL
    buildCommand: sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: csvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://csvault-ui.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard

  # ── Frontend Static Site ──────────────────────────────────────
  - type: web
    name: csvault-ui
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://csvault-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
